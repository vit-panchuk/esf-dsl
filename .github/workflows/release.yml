name: Release

# Tag a version and this builds it, checks the tarball is what it claims to
# be, and attaches it to a GitHub Release. npm publishing is a separate,
# opt-in step: it only runs if an NPM_TOKEN secret exists, so the workflow
# is useful before there is a decision about publishing anywhere.
#
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile

      # Nothing ships that has not passed the same gates as a normal commit.
      - name: Types
        run: bun run check
      - name: Tests
        run: bun run test
      - name: Core smoke
        run: bun run test:core
      - name: Render smoke
        run: bun run test:render

      # The tag and the manifest have to agree, or the artefact is named one
      # thing and reports another for the rest of its life.
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $PKG"
            exit 1
          fi

      # `prepack` builds dist/cli.js, so the tarball is built from this tree
      # rather than from whatever was last committed — which is the whole
      # reason dist/ is not in git.
      - name: Pack
        run: |
          bun pm pack --destination "$RUNNER_TEMP" | tail -1
          echo "TARBALL=$(ls "$RUNNER_TEMP"/esf-dsl-*.tgz)" >> "$GITHUB_ENV"

      - name: The tarball carries a working, self-contained CLI
        run: |
          cd "$RUNNER_TEMP" && tar xzf esf-dsl-*.tgz
          cd package
          # No install: this is what a consumer gets before `npm i` runs.
          node dist/cli.js check "$GITHUB_WORKSPACE/fixtures/foobar"
          node dist/cli.js emit  "$GITHUB_WORKSPACE/fixtures/foobar" --out "$RUNNER_TEMP/out"
          test -s "$RUNNER_TEMP/out/report.md"

      - name: A licence is present
        run: |
          if [ ! -f LICENSE ] && [ ! -f LICENCE ]; then
            echo "::error::no LICENSE file — publishing without one gives nobody permission to use this."
            exit 1
          fi

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TARBALL }}
          generate_release_notes: true

      # Opt-in: runs only once a token exists. Provenance ties the published
      # package to this workflow run, which is worth having from the first
      # release rather than retrofitted.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
